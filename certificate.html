<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ผลงาน & เกียรติบัตร</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Prompt',sans-serif;
}

body{
    background: linear-gradient(135deg,#f5e8ff,#ead7ff);
    min-height:100vh;
    overflow-x:hidden;
}

/* หัวใจลอย */
.heart{
    position:fixed;
    color:white;
    font-size:30px;
    opacity:0.7;
    animation:float 10s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-150px);
    }
}

/* หัวข้อ */
.header{
    text-align:center;
    padding:60px 20px;
}

.header h1{
    color:#8b5cf6;
    font-size:3rem;
    margin-bottom:10px;
}

.header p{
    color:#666;
    font-size:1.2rem;
}

/* กล่องผลงาน */
.container{
    width:90%;
    max-width:1300px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:30px;
    padding-bottom:150px;
}

.card{
    background:white;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card h3{
    color:#8b5cf6;
    margin-bottom:10px;
}

.card p{
    color:#666;
}

/* ปุ่ม Back */
.btn{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    padding:12px 35px;
    background:#b57cff;
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-size:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.btn:hover{
    background:#9b5cff;
}

</style>
</head>

<body>

<!-- หัวใจลอย -->
<div class="heart" style="left:10%;animation-delay:0s;">🤍</div>
<div class="heart" style="left:25%;animation-delay:2s;">🤍</div>
<div class="heart" style="left:45%;animation-delay:4s;">🤍</div>
<div class="heart" style="left:65%;animation-delay:1s;">🤍</div>
<div class="heart" style="left:85%;animation-delay:3s;">🤍</div>

<!-- หัวข้อ -->
<div class="header">
    <h1>💜 ผลงาน & เกียรติบัตร 💜</h1>
    <p>รวมผลงานและความภาคภูมิใจของฉัน</p>
</div>

<!-- ผลงาน -->
<div class="container">

    <div class="card">
        <a href="certificate1.jpg" target="_blank">
            <img src="certificate1.jpg" alt="เกียรติบัตร">
        </a>
        <div class="card-content">
            <h3>เกียรติบัตรการแข่งขัน</h3>
            <p>ได้รับรางวัลจากการแข่งขันทางวิชาการ</p>
        </div>
    </div>

    <div class="card">
        <a href="certificate2.jpg" target="_blank">
            <img src="certificate2.jpg" alt="กิจกรรมอบรม">
        </a>
        <div class="card-content">
            <h3>กิจกรรมอบรม</h3>
            <p>เข้าร่วมอบรมพัฒนาทักษะต่าง ๆ</p>
        </div>
    </div>

    <div class="card">
        <a href="certificate3.jpg" target="_blank">
            <img src="certificate3.jpg" alt="ผลงานเด่น">
        </a>
        <div class="card-content">
            <h3>ผลงานเด่น</h3>
            <p>โครงงานและผลงานที่ภาคภูมิใจ</p>
        </div>
    </div>

</div>

<!-- ปุ่ม Back -->
<a href="portfolio.html" class="btn">Back</a>

</body>
</html>
