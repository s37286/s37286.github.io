<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | Warintha Lueangoon</title>

<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Mali', cursive;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    padding-top:72px;
    overflow-x:hidden;

    color:#5b3048;

    background:
        radial-gradient(
            circle at 8% 18%,
            rgba(255,177,208,0.82),
            transparent 25%
        ),
        radial-gradient(
            circle at 92% 15%,
            rgba(245,185,207,0.75),
            transparent 28%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(204,91,139,0.35),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #fff7fb,
            #ffe8f2,
            #ffd4e5,
            #f5bfd5
        );

    position:relative;
}


/* =========================
   พื้นหลังตกแต่ง
========================= */

.bg{
    position:fixed;
    pointer-events:none;
    z-index:-1;
}

.glow1{
    width:280px;
    height:280px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #ffb3d0,
            #e86b9c
        );

    opacity:0.20;

    top:80px;
    left:-120px;

    filter:blur(8px);
}

.glow2{
    width:330px;
    height:330px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #f6b4cc,
            #b84d78
        );

    opacity:0.18;

    right:-150px;
    bottom:-100px;

    filter:blur(10px);
}

.glow3{
    width:130px;
    height:130px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #ff9fc5,
            #d95b91
        );

    opacity:0.20;

    right:15%;
    top:180px;

    filter:blur(7px);
}


/* =========================
   ดาวตกแต่ง
========================= */

.star{
    position:fixed;

    color:#c94c7d;

    font-size:25px;

    opacity:0.5;

    animation:
        twinkle
        2.5s
        ease-in-out
        infinite;
}

.star1{
    top:150px;
    left:8%;
}

.star2{
    top:350px;
    right:8%;

    animation-delay:1s;
}

.star3{
    bottom:90px;
    left:12%;

    animation-delay:1.5s;
}

@keyframes twinkle{

    0%,100%{
        transform:
            scale(1)
            rotate(0);

        opacity:0.35;
    }

    50%{
        transform:
            scale(1.35)
            rotate(15deg);

        opacity:0.85;
    }

}


/* =========================
   NAVBAR
========================= */

.navbar{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 7%;

    background:
        rgba(255,250,253,0.90);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(190,65,115,0.15);

    box-shadow:
        0 8px 30px rgba(150,45,90,0.13);

    z-index:1000;
}


/* =========================
   โรงเรียน
========================= */

.school{

    display:flex;

    align-items:center;

    gap:12px;
}

.school-logo{

    width:42px;
    height:42px;

    object-fit:contain;

    padding:3px;

    background:white;

    border-radius:13px;

    box-shadow:
        0 0 0 2px #f3a2bd,
        0 5px 14px rgba(160,50,90,0.16);
}

.school-name{

    color:#71354f;

    font-size:15px;

    font-weight:bold;
}


/* =========================
   ปุ่มหน้าแรก
========================= */

.back-button{

    text-decoration:none;

    color:white;

    font-size:14px;

    font-weight:bold;

    padding:10px 20px;

    border-radius:30px;

    background:
        linear-gradient(
            100deg,
            #e66d9c,
            #c94c7d,
            #96345d
        );

    box-shadow:
        0 8px 22px rgba(160,50,90,0.28);

    transition:0.35s;
}

.back-button:hover{

    transform:
        translateY(-3px)
        scale(1.05);

    box-shadow:
        0 12px 30px rgba(145,45,80,0.38);
}


/* =========================
   CONTAINER
========================= */

.container{

    width:92%;
    max-width:1050px;

    margin:auto;

    padding:38px 10px 70px;

    text-align:center;
}


/* =========================
   TITLE
========================= */

.title{

    font-size:48px;

    line-height:1.3;

    background:
        linear-gradient(
            90deg,
            #c83f73,
            #e06495,
            #c94c7d,
            #96345d
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
        0 5px 25px rgba(190,65,115,0.12);

    margin-bottom:5px;

    animation:titleShow 1s ease;
}

.subtitle{

    color:#92516b;

    font-size:17px;

    margin-bottom:25px;

    animation:titleShow 1.2s ease;
}

@keyframes titleShow{

    from{
        opacity:0;
        transform:translateY(-15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================
   PROFILE
========================= */

.top-profile{

    position:relative;

    display:inline-block;

    margin:5px 0 45px;
}


/* วงแหวนด้านหลัง */

.top-profile::before{

    content:"";

    position:absolute;

    width:175px;
    height:175px;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    background:
        linear-gradient(
            135deg,
            #f4a1bd,
            #d95b8b,
            #96345d
        );

    opacity:0.30;

    filter:blur(5px);

    animation:pulse 3s ease-in-out infinite;
}

@keyframes pulse{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }

}

.top-profile img{

    position:relative;

    width:145px;
    height:145px;

    object-fit:cover;

    border-radius:50%;

    border:6px solid white;

    box-shadow:
        0 0 0 4px #e56b9b,
        0 0 0 9px #c94c7d,
        0 0 0 14px #f7c4d8,
        0 15px 35px rgba(135,45,85,0.25);

    transition:0.5s;

    animation:profileShow 1s ease;
}

.top-profile img:hover{

    transform:
        scale(1.08)
        rotate(-4deg);

    box-shadow:
        0 0 0 5px #e66d9c,
        0 0 0 10px #b84270,
        0 0 0 15px #f4b4cb,
        0 20px 42px rgba(135,45,85,0.30);
}

@keyframes profileShow{

    from{
        opacity:0;
        transform:scale(0.75);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}


/* =========================
   MENU
========================= */

.menu-list{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:22px;

    max-width:960px;

    margin:auto;
}


/* =========================
   MENU CARD
========================= */

.menu-card{

    min-height:125px;

    display:flex;

    align-items:center;

    position:relative;

    overflow:hidden;

    text-decoration:none;

    padding:20px 22px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.94),
            rgba(255,239,247,0.88),
            rgba(255,222,236,0.72)
        );

    border:
        2px solid rgba(255,255,255,0.96);

    border-radius:28px;

    backdrop-filter:blur(15px);

    box-shadow:
        0 12px 30px rgba(150,45,90,0.12);

    transition:
        transform 0.4s,
        box-shadow 0.4s;
}


/* แสงด้านบนของการ์ด */

.menu-card::after{

    content:"";

    position:absolute;

    width:170px;
    height:170px;

    border-radius:50%;

    right:-75px;
    top:-90px;

    background:
        linear-gradient(
            135deg,
            #f4a1bd,
            #d95b8b
        );

    opacity:0.20;

}


/* เส้นสีด้านซ้าย */

.menu-card::before{

    content:"";

    position:absolute;

    left:0;
    top:0;

    width:7px;
    height:100%;

    background:
        linear-gradient(
            180deg,
            #e66d9c,
            #c94c7d,
            #96345d
        );

}


/* Hover */

.menu-card:hover{

    transform:
        translateY(-9px)
        scale(1.015);

    box-shadow:
        0 20px 45px rgba(150,45,90,0.20);
}


/* =========================
   NUMBER
========================= */

.number{

    width:52px;
    height:52px;

    min-width:52px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:18px;

    color:white;

    font-size:21px;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #e66d9c,
            #c94c7d,
            #96345d
        );

    box-shadow:
        0 8px 20px rgba(160,50,90,0.25);

    margin-right:13px;

}


/* =========================
   ICON
========================= */

.icon{

    width:55px;
    height:55px;

    min-width:55px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #fff0f6,
            #ffdce9,
            #f6bfd4
        );

    border:
        2px solid white;

    font-size:28px;

    margin-right:15px;

    box-shadow:
        0 6px 16px rgba(150,45,90,0.10);

    transition:0.4s;
}

.menu-card:hover .icon{

    transform:
        rotate(-5deg)
        scale(1.08);
}


/* =========================
   TEXT
========================= */

.menu-text{

    text-align:left;

    flex:1;

    position:relative;

    z-index:2;
}

.menu-text h2{

    font-size:20px;

    color:#813653;

    margin-bottom:3px;
}

.menu-text p{

    font-size:14px;

    color:#c94c7d;
}


/* =========================
   ARROW
========================= */

.arrow{

    width:38px;
    height:38px;

    min-width:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:white;

    font-size:27px;

    background:
        linear-gradient(
            135deg,
            #e66d9c,
            #96345d
        );

    box-shadow:
        0 6px 16px rgba(160,50,90,0.22);

    transition:0.35s;

    position:relative;

    z-index:2;
}

.menu-card:hover .arrow{

    transform:
        translateX(6px)
        rotate(5deg);
}


/* =========================
   การ์ดที่ 5 อยู่ตรงกลาง
========================= */

.menu-card:nth-child(5){

    grid-column:
        1 / 3;

    width:50%;

    justify-self:center;
}


/* =========================
   MOBILE
========================= */

@media(max-width:750px){

    body{
        padding-top:64px;
    }

    .navbar{

        height:60px;

        padding:0 15px;
    }

    .school-logo{

        width:35px;
        height:35px;
    }

    .school-name{

        font-size:10px;
    }

    .back-button{

        font-size:10px;

        padding:7px 12px;
    }

    .container{

        padding:
            30px 5px 45px;
    }

    .title{

        font-size:32px;
    }

    .subtitle{

        font-size:14px;
    }

    .top-profile{

        margin-bottom:35px;
    }

    .top-profile img{

        width:120px;
        height:120px;
    }

    .top-profile::before{

        width:150px;
        height:150px;
    }

    .menu-list{

        grid-template-columns:1fr;

        gap:14px;
    }

    .menu-card{

        min-height:95px;

        padding:14px;

        border-radius:22px;
    }

    .menu-card:nth-child(5){

        grid-column:auto;

        width:100%;
    }

    .number{

        width:42px;
        height:42px;

        min-width:42px;

        font-size:17px;

        border-radius:14px;

        margin-right:9px;
    }

    .icon{

        width:44px;
        height:44px;

        min-width:44px;

        font-size:23px;

        border-radius:14px;

        margin-right:9px;
    }

    .menu-text h2{

        font-size:16px;
    }

    .menu-text p{

        font-size:11px;
    }

    .arrow{

        width:32px;
        height:32px;

        min-width:32px;

        font-size:21px;
    }

    .star{

        font-size:18px;
    }

}

</style>

</head>

<body>

<!-- พื้นหลัง -->

<div class="bg glow1"></div>
<div class="bg glow2"></div>
<div class="bg glow3"></div>

<div class="star star1">✦</div>
<div class="star star2">✧</div>
<div class="star star3">♡</div>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <div class="school">

        <img
            src="IMG_2964.jpeg"
            alt="โลโก้โรงเรียน"
            class="school-logo"
        >

        <div class="school-name">
            โรงเรียนบ้านบึงอุตสาหกรรมนุเคราะห์
        </div>

    </div>


    <a href="index.html" class="back-button">
        ← หน้าแรก
    </a>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">

    <h1 class="title">
        Portfolio ของฉัน
    </h1>

    <p class="subtitle">
        ✨ Section - เลือกชม ✨
    </p>


    <!-- รูปตัวเอง -->

    <div class="top-profile">

        <img
            src="port.jpg"
            alt="Warintha Lueangoon"
        >

    </div>


    <!-- =========================
         MENU
    ========================= -->

    <div class="menu-list">


        <!-- 1. SOP -->

        <a href="sop.html" class="menu-card">

            <div class="number">1</div>

            <div class="icon">📝</div>

            <div class="menu-text">

                <h2>SOP</h2>

                <p>Statement of Purpose</p>

            </div>

            <div class="arrow">›</div>

        </a>


        <!-- 2. ประวัติส่วนตัว -->

        <a href="profile.html" class="menu-card">

            <div class="number">2</div>

            <div class="icon">👩🏻</div>

            <div class="menu-text">

                <h2>ประวัติส่วนตัว</h2>

                <p>Profile</p>

            </div>

            <div class="arrow">›</div>

        </a>


        <!-- 3. ประวัติการศึกษา -->

        <a href="education.html" class="menu-card">

            <div class="number">3</div>

            <div class="icon">🎓</div>

            <div class="menu-text">

                <h2>ประวัติการศึกษา</h2>

                <p>Education</p>

            </div>

            <div class="arrow">›</div>

        </a>


        <!-- 4. ผลงานและกิจกรรม -->

        <a href="works.html" class="menu-card">

            <div class="number">4</div>

            <div class="icon">🌟</div>

            <div class="menu-text">

                <h2>ผลงานและกิจกรรม</h2>

                <p>Works & Activities</p>

            </div>

            <div class="arrow">›</div>

        </a>


        <!-- 5. เกียรติบัตรและรางวัล -->

        <a href="certificates.html" class="menu-card">

            <div class="number">5</div>

            <div class="icon">🏆</div>

            <div class="menu-text">

                <h2>เกียรติบัตรและรางวัล</h2>

                <p>Certificates</p>

            </div>

            <div class="arrow">›</div>

        </a>


    </div>

</main>

</body>
</html>
